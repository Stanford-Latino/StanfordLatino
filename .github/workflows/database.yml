# Applies new database updates (supabase/0NN_*.sql) automatically.
# Each file runs once, in order; finished files are recorded in public._migrations.
# Needs one repository secret: SUPABASE_DB_URL (see README).
name: Update database

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply new updates
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL}" ]; then echo "Add the SUPABASE_DB_URL secret first."; exit 1; fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -qc "create table if not exists public._migrations (name text primary key, applied_at timestamptz not null default now()); alter table public._migrations enable row level security;"
          for f in $(ls supabase/[0-9][0-9][0-9]_*.sql | sort); do
            name=$(basename "$f")
            done=$(psql "$DATABASE_URL" -tAc "select 1 from public._migrations where name = '$name'")
            if [ "$done" = "1" ]; then echo "Already applied: $name"; continue; fi
            echo "Applying: $name"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction -q -f "$f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -qc "insert into public._migrations (name) values ('$name')"
          done
